<style>
  @font-face { font-family: "Playfair Display"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(fonts/playfair-display-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(fonts/manrope-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Serif Armenian"; font-style: normal; font-weight: 100 900; font-display: swap; unicode-range: U+0530-058F, U+FB13-FB17; src: url(fonts/noto-serif-armenian-armenian-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Armenian"; font-style: normal; font-weight: 100 900; font-display: swap; unicode-range: U+0530-058F, U+FB13-FB17; src: url(fonts/noto-sans-armenian-armenian-wght-normal.woff2) format("woff2"); }

  :root {
    --paper: #f3f1ec;
    --ink: #0a0a0a;
    --mute: #6b6861;
    --line: rgba(10, 10, 10, 0.16);
    --serif: "Playfair Display", "Noto Serif Armenian", Georgia, serif;
    --sans: "Manrope", "Noto Sans Armenian", system-ui, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--paper); color: var(--ink);
    font: 500 16px/1.45 var(--sans); overflow-x: clip; -webkit-tap-highlight-color: transparent; }
  svg { display: block; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 999px; }

  /* big faint monogram, behind everything */
  .wm { position: fixed; right: -9vw; bottom: -17vh; z-index: 0; pointer-events: none; user-select: none;
    font: 700 min(125vw, 860px)/1 var(--serif); color: rgba(10, 10, 10, 0.04);
    transform: translate(calc(var(--lx, 0) * -22px), calc(var(--ly, 0) * -16px)); }

  .card { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; justify-content: center;
    padding: max(26px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left)); }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hero-logo { position: relative; width: min(52vw, 220px); aspect-ratio: 1; }
  .logo { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 50%;
    box-shadow: 0 28px 48px -24px rgba(10, 10, 10, 0.6), 0 6px 16px -8px rgba(10, 10, 10, 0.35);
    animation: pop 1.2s var(--ease) both; }
  /* 3D medallion (js/medallion.js) draws on a canvas 30% larger than the disc so a tilted coin never clips */
  .coin { position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; opacity: 0; touch-action: pan-y; cursor: grab;
    filter: drop-shadow(0 26px 20px rgba(10, 10, 10, 0.3)) drop-shadow(0 5px 7px rgba(10, 10, 10, 0.2)); }
  .coin:active { cursor: grabbing; }
  .is-3d .coin { animation: coin-in 0.4s ease both; }
  .is-3d .logo { animation: logo-out 0.4s ease forwards; }
  @keyframes coin-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes logo-out { to { opacity: 0; } }

  /* menswear feel: soft spotlight + pinstripe fabric that fade out towards the edges; both follow the mouse / phone tilt */
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(52% 38% at calc(50% + var(--lx, 0) * 9%) calc(23% + var(--ly, 0) * 5%), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 72%); }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(10, 10, 10, 0.05) 0 1px, transparent 1px 7px);
    -webkit-mask-image: radial-gradient(75% 60% at calc(50% + var(--lx, 0) * 6%) 30%, #000 10%, transparent 75%);
    mask-image: radial-gradient(75% 60% at calc(50% + var(--lx, 0) * 6%) 30%, #000 10%, transparent 75%); }
  .tag { display: flex; align-items: center; gap: 14px; margin: 24px 0 0;
    font: 400 1rem/1 var(--serif); letter-spacing: 0.1em; color: var(--mute);
    animation: fade 1s var(--ease) 0.35s both; }
  .tag::before, .tag::after { content: ""; width: 30px; height: 1px; background: currentColor; opacity: 0.55; }

  .actions { margin-top: clamp(22px, 4svh, 34px); display: grid; gap: 18px; }
  .rise { animation: up 0.9s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 300ms); }

  /* call */
  .call { display: flex; align-items: center; gap: 14px; padding: 9px 16px 9px 9px; border-radius: 999px;
    background: var(--ink); color: var(--paper); transition: transform 0.25s var(--ease); }
  .call { position: relative; overflow: hidden; isolation: isolate; }
  .call::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; transform: translateX(-130%);
    background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.22) 50%, transparent 62%);
    animation: sheen 6.5s ease-in-out 2.4s infinite; }
  @keyframes sheen { 0%, 62% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
  .call .ic { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center; }
  .call .ic svg { width: 22px; height: 22px; }
  .call .t { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .call small { font-size: 0.75rem; letter-spacing: 0.04em; opacity: 0.72; }
  .call b { font: 600 1.4rem/1.1 var(--serif); font-variant-numeric: lining-nums; letter-spacing: 0.01em; white-space: nowrap; }
  .ar { flex: none; width: 20px; height: 20px; }
  .call .ar { opacity: 0.8; }
  .call:active { transform: scale(0.985); }

  /* messengers */
  .msgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .msg { display: grid; justify-items: center; gap: 9px; padding: 4px 0; font: 700 0.75rem/1 var(--sans); letter-spacing: 0.03em; }
  .d { flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); transition: transform 0.4s var(--ease); }
  .msg .d { width: 58px; height: 58px; }
  .msg .d svg { width: 26px; height: 26px; fill: currentColor; }
  .msg:active .d { transform: scale(0.94); }

  /* social */
  .social { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .social a { display: flex; align-items: center; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--line); border-radius: 0; }
  .social .d { position: relative; width: 44px; height: 44px; color: #fff; }
  .social .d svg { width: 21px; height: 21px; fill: currentColor; }
  /* live brand colours + a soft pulsing ring so they read as active, tappable links */
  .social .d.fb { background: #1877f2; --ring: rgba(24, 119, 242, 0.5); }
  .social .d.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); --ring: rgba(214, 36, 159, 0.5); }
  .social .d::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    animation: ring 2.8s ease-out 1.6s infinite; }
  .social .d.ig::after { animation-delay: 2.9s; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--ring); } 65%, 100% { box-shadow: 0 0 0 13px rgba(0, 0, 0, 0); } }
  @media (hover: hover) { .social a:hover .d { transform: scale(1.08); } }
  .social a:active .d { transform: scale(0.94); }
  .social b { flex: 1; font: 600 1.5rem/1 var(--serif); letter-spacing: 0.005em; }
  .social .nm { flex: 1; min-width: 0; display: grid; gap: 5px; }
  .social .nm b { flex: none; }
  .social small { font: 600 0.75rem/1 var(--sans); letter-spacing: 0.04em; color: var(--mute); }
  .social .ar { color: var(--mute); transition: transform 0.4s var(--ease), color 0.3s; }
  .social a:active { background: rgba(10, 10, 10, 0.05); }

  /* where: dark brand map (inline svg, built from OpenStreetMap data by _src/make_map.py) */
  .sect { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 14px;
    font: 400 1rem/1 var(--serif); letter-spacing: 0.1em; color: var(--mute); }
  .sect::before, .sect::after { content: ""; flex: 1; max-width: 56px; height: 1px; background: currentColor; opacity: 0.5; }
  .mapcard { position: relative; border-radius: 22px; overflow: hidden; background: #0e0e0e; aspect-ratio: 16 / 10;
    box-shadow: 0 22px 36px -24px rgba(10, 10, 10, 0.75), 0 4px 10px -6px rgba(10, 10, 10, 0.4); }
  .maplink { display: block; width: 100%; height: 100%; border-radius: 0; }
  .mapsvg { display: block; width: 100%; height: 100%; }
  .mapsvg text { font: 600 24px/1 "Noto Sans Armenian", "Manrope", system-ui, sans-serif; letter-spacing: 0.02em;
    fill: #d9d6ce; stroke: #0e0e0e; stroke-width: 5px; stroke-linejoin: round; paint-order: stroke; }
  .mp-pulse { transform-box: fill-box; transform-origin: center; animation: mp 2.8s ease-out 1s infinite; }
  @keyframes mp { 0% { transform: scale(0.3); opacity: 0.9; } 100% { transform: scale(3.4); opacity: 0; } }
  .osm { position: absolute; right: 8px; bottom: 7px; padding: 3px 7px; border-radius: 7px; border-radius: 7px;
    background: rgba(0, 0, 0, 0.55); color: rgba(255, 255, 255, 0.78); font: 600 0.625rem/1.2 var(--sans); }
  .dirs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .dirs .alt { grid-column: 1 / -1; }
  .dir { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 10px; white-space: nowrap;
    border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 0.95rem/1.2 var(--sans); transition: transform 0.25s var(--ease); }
  .dir svg { width: 20px; height: 20px; }
  .dir.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .dir[hidden] { display: none; }
  .dir:active { transform: scale(0.985); }
  @media (hover: hover) { .dir:hover { transform: translateY(-2px); } }

  /* save */
  .save { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 20px;
    border: 1.5px solid var(--ink); border-radius: 999px; font: 700 0.95rem/1.2 var(--sans); letter-spacing: 0.01em;
    transition: background 0.3s, color 0.3s; }
  .save svg { width: 20px; height: 20px; }
  .save:active { background: var(--ink); color: var(--paper); }

  @media (hover: hover) {
    .call:hover { transform: translateY(-2px); }
    .msg:hover .d { transform: translateY(-3px); }
    .social a:hover .ar { transform: translate(3px, -3px); color: var(--ink); }
    .save:hover { background: var(--ink); color: var(--paper); }
  }

  .tag { white-space: nowrap; }
  @media (max-width: 350px) {
    .tag { gap: 10px; font-size: 0.9rem; letter-spacing: 0.04em; }
    .tag::before, .tag::after { width: 16px; }
  }

  @media (max-height: 700px) and (max-width: 440px) {
    .hero-logo { width: min(44vw, 170px); }
    .tag { margin-top: 18px; }
    .actions { gap: 12px; }
  }

  @keyframes pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .logo, .tag, .rise, .call::after, .social .d::after, .mp-pulse { animation: none; }
    .is-3d .coin { animation: none; opacity: 1; }
    .is-3d .logo { animation: none; opacity: 0; }
    * { transition: none !important; }
  }
</style>
</head>
